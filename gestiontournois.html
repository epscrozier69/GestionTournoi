<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EPS Gestion des tournois</title>
<style>
  :root{
    --c1:#2563eb; --c2:#7c3aed; --c3:#db2777; --c4:#ea580c; --c5:#dc2626;
    --c6:#0891b2; --c7:#4f46e5; --c8:#b45309; --c9:#e11d48; --c10:#0ea5e9;
    --bg:#f1f5f9; --panel:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
    --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
    --radius:14px;
    --shadow:0 4px 16px rgba(15,23,42,.08);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);}
  header{
    background:linear-gradient(120deg,var(--c1),var(--c2) 60%,var(--c3));
    color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
    box-shadow:var(--shadow);position:sticky;top:0;z-index:50;
  }
  header h1{margin:0;font-size:1.3rem;font-weight:700;}
  header .sub{font-size:.78rem;opacity:.9;}
  .sync-status{
    font-size:.75rem;font-weight:600;padding:5px 12px;border-radius:999px;
    background:rgba(255,255,255,.2);color:#fff;white-space:nowrap;
  }
  .sync-status.error{background:#fee2e2;color:#7f1d1d;}
  .sync-status.ok{background:rgba(255,255,255,.25);}

  nav.tabs{
    display:flex;gap:6px;padding:10px 16px;background:#e9edf5;flex-wrap:wrap;position:sticky;top:62px;z-index:40;
    box-shadow:inset 0 -1px 0 var(--line);
  }
  nav.tabs button{
    border:none;background:#fff;color:var(--muted);padding:8px 16px;border-radius:999px;cursor:pointer;
    font-weight:600;font-size:.85rem;box-shadow:0 1px 3px rgba(0,0,0,.06);transition:.15s;
  }
  nav.tabs button:hover{color:var(--ink);}
  nav.tabs button.active{background:var(--c1);color:#fff;box-shadow:0 3px 10px rgba(37,99,235,.35);}

  main{padding:14px;max-width:1500px;margin:0 auto;}
  .panel{display:none;}
  .panel.active{display:block;animation:fadeIn .2s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  .card{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:14px;}
  .card h3{margin:0 0 12px;font-size:1rem;display:flex;align-items:center;gap:8px;}
  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
  .btn{
    border:none;border-radius:9px;padding:10px 16px;font-weight:600;font-size:.85rem;cursor:pointer;color:#fff;
    background:var(--c1);box-shadow:0 2px 6px rgba(37,99,235,.3);transition:.15s;
  }
  .btn:hover{filter:brightness(1.08);transform:translateY(-1px);}
  .btn:disabled{opacity:.6;cursor:default;transform:none;}
  .btn.secondary{background:var(--c6);}
  .btn.danger{background:var(--c5);}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none;}
  .btn.small{padding:5px 10px;font-size:.75rem;}

  .empty-state{padding:30px;text-align:center;color:var(--muted);font-size:.9rem;}

  /* Tables générales */
  .table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line);}
  table{border-collapse:collapse;width:100%;font-size:.82rem;}
  thead th{color:#fff;padding:8px 10px;text-align:left;white-space:nowrap;cursor:pointer;user-select:none;font-weight:600;}
  thead th .arrow{font-size:.68rem;opacity:.85;margin-left:3px;}
  thead tr.filters th{background:#f8fafc;padding:5px 6px;cursor:default;}
  thead tr.filters input, thead tr.filters select{
    width:100%;padding:4px 5px;border:1px solid var(--line);border-radius:5px;font-size:.75rem;color:var(--ink);background:#fff;
  }
  tbody td{padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
  tbody tr:nth-child(odd){background:#ffffff;}
  tbody tr:nth-child(even){background:#eef1f6;}
  tbody tr:hover{background:#dbeafe;}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.7rem;font-weight:700;color:#fff;white-space:nowrap;}
  .badge.sexeF{background:var(--c3);}
  .badge.sexeG{background:var(--c1);}
  .badge.empty{background:#cbd5e1;color:#475569;}

  /* Config */
  .config-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px;}
  .field label{display:block;font-size:.78rem;font-weight:600;color:var(--muted);margin-bottom:4px;}
  .field select, .field input{
    width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:.85rem;background:#fff;
  }
  .hint{font-size:.7rem;color:var(--muted);margin-top:3px;}
  .muted{color:var(--muted);font-size:.78rem;}

  /* Classement total : carte mise en évidence par une couleur dédiée */
  .classement-total-card{
    border-left:6px solid var(--c8);
    background:linear-gradient(135deg, #fffbeb, var(--panel) 55%);
  }
  .classement-total-card h3{color:var(--c8);}

  /* Carte d'import de classe et une vignette séparée par classe importée,
     toutes côte à côte comme des cartes indépendantes (pas regroupées dans
     un conteneur commun). */
  .activity-header-layout{display:flex;gap:14px;flex-wrap:wrap;align-items:stretch;}
  .activity-import-card{flex:0 1 320px;min-width:260px;}

  /* Classes et séances (sous-onglets) */
  .seance-tabs{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .seance-tabs button{
    border:none;background:#f1f5f9;color:var(--muted);padding:9px 18px;border-radius:999px;cursor:pointer;
    font-weight:700;font-size:.92rem;transition:.15s;
  }
  .seance-tabs button:hover{color:var(--ink);}
  .seance-tabs button.active{background:var(--c7);color:#fff;box-shadow:0 3px 10px rgba(37,99,235,.3);}
  /* Chaque classe importée est sa propre vignette (même gabarit que les
     cartes de l'appli : coins arrondis, ombre), plutôt qu'une pastille dans
     un conteneur partagé. La classe active se distingue par sa pleine
     opacité + un léger zoom. */
  .classe-card{
    flex:0 1 200px;min-width:160px;border:none;font-size:1.1rem;font-weight:800;letter-spacing:.02em;
    color:#fff;cursor:pointer;opacity:.55;transition:.15s;
    display:flex;align-items:center;justify-content:center;text-align:center;
  }
  .classe-card:hover{opacity:.8;}
  .classe-card.active{opacity:1;box-shadow:0 6px 18px rgba(0,0,0,.2);transform:scale(1.03);}

  /* Teams / Poules grids */
  .teams-grid, .poules-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:14px;}

  /* Défis classement progressif : matchs à gauche (3 tables par ligne), classement à droite */
  .defis-layout{display:grid;grid-template-columns:2fr 1fr;gap:16px;align-items:start;}
  .defis-tables-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .defis-classement-live{
    border:2px solid var(--line);border-radius:12px;padding:12px;background:#f8fafc;
    position:sticky;top:12px;
  }
  .defis-classement-live h4{margin:0 0 4px;font-size:.95rem;}
  @media (max-width:900px){
    .defis-layout{grid-template-columns:1fr;}
    .defis-tables-grid{grid-template-columns:repeat(2,1fr);}
    .defis-classement-live{position:static;}
  }
  @media (max-width:560px){
    .defis-tables-grid{grid-template-columns:1fr;}
  }
  /* Texte plus grand dans les vignettes de table, sans agrandir la vignette :
     on compense en resserrant les marges/paddings autour. */
  .defis-tables-grid .poule-card{padding:8px;}
  .defis-tables-grid .poule-card h4{font-size:1.05rem;margin-bottom:4px;}
  .defis-tables-grid .poule-card .hint{font-size:.82rem;margin:2px 0;}
  .defis-tables-grid .poule-card .btn{font-size:1.05rem;padding:6px 10px;}
  .defis-tables-grid .poule-card .arbitre-label{font-size:.92rem;padding:4px 7px;margin-top:4px;}
  .team-card, .poule-card{
    border:2px solid var(--line);border-radius:12px;padding:10px;background:#f8fafc;
  }
  .poule-card h4, .team-card .team-name{
    margin:0 0 8px;font-size:.9rem;font-weight:700;color:var(--ink);
  }
  .match-row{
    display:flex;align-items:center;gap:4px;flex-wrap:wrap;cursor:pointer;
    padding:6px 4px;border-bottom:1px dashed var(--line);font-size:.78rem;border-radius:6px;
  }
  .match-row:hover{background:#eef2ff;}
  .match-row:last-child{border-bottom:none;}
  .match-name{font-weight:600;}
  .match-name.winner{color:var(--ok);text-decoration:underline;}
  .arbitre-label{
    margin-top:8px;padding:5px 8px;border-radius:7px;background:#fff7ed;
    color:#9a3412;font-size:.85rem;font-weight:600;
  }
  .table-players-summary{
    display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:8px;padding-bottom:8px;
    border-bottom:1px solid var(--line);font-size:.78rem;color:var(--muted);
  }
  .table-players-summary b{color:var(--ink);}
  .team-card .team-name{
    width:100%;border:1px solid var(--line);border-radius:7px;padding:5px 7px;background:#fff;
  }
  .team-card ul, .poule-card ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;}
  .team-card li, .poule-card li{
    display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:.8rem;
    background:#fff;border-radius:7px;padding:5px 7px;border:1px solid var(--line);
  }
  .team-card li select, .poule-card li select{
    font-size:.68rem;padding:2px 4px;border:1px solid var(--line);border-radius:5px;max-width:110px;
  }

  /* Match schedule */
  .match-table td, .match-table th{white-space:nowrap;}
  .tour-badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.7rem;font-weight:700;color:#fff;background:var(--c7);}
  .table-badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.7rem;font-weight:700;color:#fff;background:var(--c4);}
  .poule-tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.7rem;font-weight:700;color:#fff;background:var(--c2);}

  .chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .chip{border-radius:10px;padding:6px 10px;color:#fff;font-size:.72rem;box-shadow:var(--shadow);text-align:center;}
  .chip b{display:block;font-size:1rem;}

  /* Tournoi défis : colonnes resserrées et lignes compactes pour que toute
     la classe tienne sur un écran sans avoir à scroller */
  .defis-table, .classement-table{table-layout:fixed;}
  .defis-table th, .defis-table td{text-align:center;padding:2px 6px;font-size:.78rem;}
  .defis-name{
    text-align:left !important;display:flex;align-items:center;gap:6px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .defis-table th:first-child, .defis-table td:first-child{width:170px;}
  .defis-row{cursor:pointer;}
  .defis-row:hover{background:#dbeafe;}
  .defis-cell{width:26px;font-weight:800;color:var(--ok);}
  .defis-undo{opacity:.6;flex:0 0 auto;}
  .btn.small.defis-undo{padding:2px 6px;}
  .defis-undo:hover{opacity:1;}
  .classement-table th:nth-child(1), .classement-table td:nth-child(1){width:60px;}
  .classement-table th:nth-child(2), .classement-table td:nth-child(2){width:180px;overflow:hidden;text-overflow:ellipsis;}
  /* Toutes les colonnes de chiffres (Séance 1, Séance 2..., Total) gardent la
     même largeur resserrée, quel que soit le nombre de séances affichées. */
  .classement-table th:nth-child(n+3), .classement-table td:nth-child(n+3){width:90px;}

  /* Présence */
  .presence-list{display:flex;flex-wrap:wrap;gap:6px;}
  .presence-chip{
    border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.75rem;
    background:#f8fafc;cursor:pointer;color:var(--ink);
  }
  .presence-chip.absent{background:#fee2e2;color:var(--bad);border-color:var(--bad);text-decoration:line-through;}
  .presence-chip.materiel{background:#fef3c7;color:#92400e;border-color:#d97706;text-decoration:line-through;}
  .presence-chip.dispense{background:#e0e7ff;color:#3730a3;border-color:#4f46e5;text-decoration:line-through;}
  .demi-terrain-toggle{
    display:inline-flex;align-items:center;gap:8px;margin-bottom:10px;font-size:.82rem;font-weight:600;
    cursor:pointer;background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:8px 12px;
  }
  .demi-terrain-toggle input{width:16px;height:16px;}

  /* Modale de saisie de score */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(15,23,42,.5);
    display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;
  }
  .modal-overlay[hidden]{display:none;}
  .modal-box{
    background:var(--panel);border-radius:14px;padding:20px;max-width:420px;width:100%;
    box-shadow:0 10px 40px rgba(0,0,0,.25);
  }
  .modal-box h3{margin:0 0 14px;}
  .modal-score-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .modal-player{flex:1;display:flex;flex-direction:column;gap:6px;text-align:center;}
  .modal-player label{font-weight:700;font-size:.85rem;}
  .modal-player input{
    width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:1.1rem;text-align:center;
  }
  .modal-vs{font-weight:700;color:var(--muted);}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;}

  /* Cases à cocher (choix du nombre de tables/terrains) */
  .field-row-cb{margin-bottom:14px;}
  .field-row-cb > label{display:block;font-weight:700;font-size:.82rem;margin-bottom:6px;}
  .cb-group{display:flex;gap:6px;flex-wrap:wrap;}
  .cb-opt{
    display:flex;align-items:center;justify-content:center;
    border:2px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;
    min-width:40px;text-align:center;background:#f8fafc;transition:.15s;
  }
  .cb-opt:hover{border-color:var(--c1);}
  .cb-opt input{display:none;}
  .cb-opt .code{font-weight:800;font-size:.85rem;color:var(--ink);}
  .cb-opt.checked{background:#dbeafe;border-color:var(--c1);box-shadow:0 2px 6px rgba(0,0,0,.08);}
  .cb-opt.checked .code{color:var(--c1);}

  @media (max-width:700px){
    header{padding:10px 14px;}
    header h1{font-size:1.05rem;}
    main{padding:10px;}
    nav.tabs{top:56px;padding:8px 10px;}
    .config-grid{grid-template-columns:1fr 1fr;}
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>EPS Gestion des tournois</h1>
    <div class="sub">Poules, défis et calendriers de matchs par activité</div>
  </div>
  <div class="sync-status" id="syncStatus" title="Statut de la synchronisation en ligne"></div>
</header>

<nav class="tabs" id="tabsNav"></nav>

<main>
  <div class="panel active" id="panel-general"></div>
  <div class="panel" id="panel-tennisdetable"></div>
  <div class="panel" id="panel-badminton"></div>
  <div class="panel" id="panel-handball"></div>
  <div class="panel" id="panel-ultimate"></div>
  <div class="panel" id="panel-volley"></div>
</main>

<div class="modal-overlay" id="scoreModal" hidden>
  <div class="modal-box">
    <h3>📝 Résultat du match</h3>
    <div class="modal-score-row">
      <div class="modal-player">
        <label id="scoreModalNomA">Joueur A</label>
        <input type="number" id="scoreModalScoreA" min="0" placeholder="Score">
        <button class="btn ghost small" id="btnAbandonA">Abandon</button>
      </div>
      <div class="modal-vs">vs</div>
      <div class="modal-player">
        <label id="scoreModalNomB">Joueur B</label>
        <input type="number" id="scoreModalScoreB" min="0" placeholder="Score">
        <button class="btn ghost small" id="btnAbandonB">Abandon</button>
      </div>
    </div>
    <p class="hint">Barème : victoire (écart ≥ 5) = 5 pts, victoire (écart &lt; 5) = 3 pts, défaite (écart &lt; 5) = 2 pts, défaite (écart ≥ 5) = 1 pt, abandon = 0 pt.</p>
    <div class="modal-actions">
      <button class="btn ghost" id="btnAnnulerScore">Annuler</button>
      <button class="btn" id="btnValiderScore">✅ Valider</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="presenceModal" hidden>
  <div class="modal-box">
    <h3 id="presenceModalNom">Statut de présence</h3>
    <div class="modal-actions" style="justify-content:center;flex-wrap:wrap;">
      <button class="btn" id="btnStatutPresent">✅ Présent</button>
      <button class="btn danger" id="btnStatutAbsent">🚫 Absent</button>
      <button class="btn secondary" id="btnStatutMateriel">🎽 Matériel (pas de raquette)</button>
      <button class="btn ghost" id="btnStatutDispense">📄 Dispensé</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
'use strict';

/* ---------------------------------------------------------- CONFIG ---- */
const SHEET_ID = '1UpkwkrQ7L6BdOGIg2T1OSAHybTdLNp7jutEHqjyNqj8';
const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=0`;
// URL du Web App Google Apps Script (voir GoogleAppsScript.gs) qui sert de
// stockage central : une fois déployé, collez ici l'URL /exec fournie par
// Google. Avec cette URL renseignée, les données se synchronisent
// automatiquement en ligne et sont donc retrouvées sur n'importe quel
// appareil ouvrant ce même fichier (tablette, ordi perso, ordi du collège...).
// Tant que c'est vide, l'appli fonctionne normalement mais uniquement en local.
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxPeUIo_RZ1c5OTdV_YuOZkPzt4e3xl8J6crst_VbA_2db3ffACGJReGWAIW1OEim27/exec';

const ACTIVITIES = {
  'Tennis de table': {
    icon:'🏓', type:'individuel', terrainLabel:'Tables', defisAllowed:true,
    pouleMin:3, pouleMax:4, pouleTerrainMin:6, pouleTerrainMax:8,
    defisTerrainMin:6, defisTerrainMax:8, defaultTerrains:8,
  },
  'Badminton': {
    icon:'🏸', type:'individuel', terrainLabel:'Terrains', defisAllowed:true,
    pouleMin:3, pouleMax:4, pouleTerrainMin:6, pouleTerrainMax:13,
    defisTerrainMin:6, defisTerrainMax:8, defaultTerrains:8,
  },
  'Handball': {
    icon:'🤾', type:'equipe', terrainLabel:'Terrains', defisAllowed:false,
    pouleMin:3, pouleMax:6, pouleTerrainMin:1, pouleTerrainMax:1, defaultTerrains:1,
  },
  'Ultimate': {
    icon:'🥏', type:'equipe', terrainLabel:'Terrains', defisAllowed:false,
    pouleMin:3, pouleMax:6, pouleTerrainMin:1, pouleTerrainMax:3, defaultTerrains:1,
  },
  'Volley': {
    icon:'🏐', type:'equipe', terrainLabel:'Terrains', defisAllowed:false,
    pouleMin:3, pouleMax:12, pouleTerrainMin:3, pouleTerrainMax:9, defaultTerrains:3,
  },
};
const PALETTE = ['#2563eb','#7c3aed','#db2777','#ea580c','#dc2626','#0891b2','#4f46e5','#b45309','#e11d48','#0ea5e9'];

/* ------------------------------------------------------------ STATE --- */
// Hiérarchie : activité -> classes importées (sous-onglet, n'efface pas les
// autres classes) -> séances (sous-sous-onglet). Le classement des défis
// (wins) est porté par la classe, pas par la séance, pour assurer la
// continuité du classement d'une séance à l'autre.
function defaultSeance(numero, activite){
  const act = ACTIVITIES[activite];
  const defaultT = act.defaultTerrains || act.pouleTerrainMin;
  return {
    numero, tournamentType:'', config:{}, defisTerrains:defaultT, pouleTerrains:defaultT,
    demiTerrain:false, // Badminton uniquement : double la capacité de terrains simultanés
    absents:[], // ids d'élèves exclus des poules/défis pour cette séance (quelle qu'en soit la raison)
    absentReasons:{}, // studentId -> 'absent' | 'materiel' | 'dispense' (motif affiché sur la pastille)
    teams:[], poules:[], matches:[],
    hasardWins:{}, // défis hasard : victoires de cette séance uniquement
    defisMatches:[], defisBye:[], lastAction:null, // défis classement progressif uniquement (flux continu)
  };
}
function defaultClasseData(classe, activite){
  return {
    // wins = victoires cumulées, communes aux deux défis (hasard et
    // classement progressif partagent le même total, une victoire est une
    // victoire quel que soit le format) ; poulePoints = tournoi par poule,
    // compté à part car son barème (points selon l'écart de score) n'a rien
    // à voir avec un simple décompte de victoires.
    classe, wins:{}, poulePoints:{},
    seances:[defaultSeance(1, activite)], currentSeanceIndex:0, showClassementTotal:false,
  };
}
function defaultActivityData(){
  return { classes:{}, currentClasse:'' };
}
let STATE = {
  allStudents: [],     // {id, nomPrenom, classe, sexe} — toute la liste chargée depuis le Sheet
  activityData: {},    // activité -> { classes: {classeName: classeData}, currentClasse }
};
function ensureActivityData(){
  Object.keys(ACTIVITIES).forEach(a=>{
    if(!STATE.activityData[a]) STATE.activityData[a] = defaultActivityData();
    if(!STATE.activityData[a].classes) STATE.activityData[a].classes = {};
    if(typeof STATE.activityData[a].currentClasse !== 'string') STATE.activityData[a].currentClasse = '';
    // Rattrapage pour les données enregistrées avant l'ajout de ces champs.
    // classementWins a existé brièvement comme compteur séparé pour les
    // défis classement progressif : on refusionne ces valeurs dans cd.wins
    // (les deux défis partagent le même total de victoires) pour ne rien
    // perdre de ce qui a pu être joué entre-temps.
    Object.values(STATE.activityData[a].classes).forEach(cd=>{
      if(cd.classementWins){
        Object.keys(cd.classementWins).forEach(id=>{
          cd.wins[id] = (cd.wins[id]||0) + cd.classementWins[id];
        });
        delete cd.classementWins;
      }
      if(!cd.poulePoints) cd.poulePoints = {};
      cd.seances.forEach(s=>{
        if(!s.hasardWins) s.hasardWins = {};
        if(!s.absentReasons) s.absentReasons = {};
        if(s.lastAction === undefined) s.lastAction = null;
      });
      // Auto-réparation : recalcule systématiquement cd.wins/cd.poulePoints à
      // partir des séances (source de vérité), au cas où ils auraient été
      // désynchronisés par une ancienne version de l'appli (ex. "Effacer les
      // résultats" qui remettait le total à zéro pour toute la classe au lieu
      // de le recalculer sans la séance effacée).
      recomputeCumulativeTotals(cd);
    });
  });
}
function currentClasseData(activite){
  const data = STATE.activityData[activite];
  if(!data || !data.currentClasse) return null;
  return data.classes[data.currentClasse] || null;
}
function currentSeance(activite){
  const cd = currentClasseData(activite);
  if(!cd || !cd.seances.length) return null;
  return cd.seances[cd.currentSeanceIndex] || cd.seances[0];
}
function importerClasseDansActivite(activite, classe){
  const data = STATE.activityData[activite];
  if(!data.classes[classe]) data.classes[classe] = defaultClasseData(classe, activite);
  data.currentClasse = classe;
  saveState();
  renderActivityTab(activite);
  renderGeneral();
}
function switchClasse(activite, classe){
  STATE.activityData[activite].currentClasse = classe;
  saveState();
  renderActivityTab(activite);
}
function addSeance(activite){
  const cd = currentClasseData(activite);
  const numero = cd.seances.length ? Math.max(...cd.seances.map(s=>s.numero)) + 1 : 1;
  cd.seances.push(defaultSeance(numero, activite));
  cd.currentSeanceIndex = cd.seances.length - 1;
  saveState();
  renderActivityTab(activite);
  renderGeneral();
}
function switchSeance(activite, index){
  currentClasseData(activite).currentSeanceIndex = index;
  saveState();
  renderActivityTab(activite);
}
function deleteSeance(activite){
  const cd = currentClasseData(activite);
  if(!cd.seances.length) return;
  const seance = cd.seances[cd.currentSeanceIndex];
  const isLast = cd.seances.length === 1;
  const msg = isLast
    ? `Supprimer définitivement la Séance ${seance.numero} ? C'est la dernière séance de cette classe : le total cumulé sera aussi remis à zéro.`
    : `Supprimer définitivement la Séance ${seance.numero} et ses matchs/tours ? Le total cumulé sera recalculé sans cette séance.`;
  if(!confirm(msg)) return;
  cd.seances.splice(cd.currentSeanceIndex, 1);
  cd.currentSeanceIndex = Math.max(0, cd.currentSeanceIndex - 1);
  // Recalcule le total cumulé à partir des séances restantes (au lieu de le
  // remettre à zéro), pour ne pas fausser le classement des autres séances.
  recomputeCumulativeTotals(cd);
  saveState();
  renderActivityTab(activite);
  renderGeneral();
}
// Fixe le statut de présence d'un élève pour cette séance : null (présent),
// 'absent', 'materiel' (pas de raquette/équipement) ou 'dispense'. Les trois
// motifs d'exclusion ont le même effet sur les poules/défis (l'élève ne
// joue pas), seul le libellé affiché change. En défis classement progressif,
// exclure un élève en plein match annule aussitôt ce match (la table et son
// éventuel adversaire se libèrent) ; le remettre présent lui redonne
// aussitôt un match dès qu'une table se libère.
function setPresenceStatus(activite, studentId, status){
  const seance = currentSeance(activite);
  const act = ACTIVITIES[activite];
  if(!seance.absentReasons) seance.absentReasons = {};
  const wasAbsent = seance.absents.includes(studentId);
  if(status === null){
    if(wasAbsent) seance.absents.splice(seance.absents.indexOf(studentId), 1);
    delete seance.absentReasons[studentId];
    // Réintégration : si un tournoi par poule est en cours et que cet élève
    // n'appartient encore à aucune poule (il était exclu au moment de la
    // génération), on l'ajoute à la poule la moins remplie au lieu de le
    // laisser orphelin (sans quoi il resterait "présent" sans jouer nulle part).
    if(wasAbsent && seance.tournamentType === 'poule' && act.type === 'individuel' && seance.poules.length){
      const dejaMembre = seance.poules.some(p=>p.members.includes(studentId));
      if(!dejaMembre){
        let target = seance.poules[0], min = Infinity;
        seance.poules.forEach(p=>{ if(p.members.length < min){ min = p.members.length; target = p; } });
        target.members.push(studentId);
        seance.matches = []; // les matchs existants ne tenaient pas compte de cet élève
      }
    }
  } else {
    if(!wasAbsent) seance.absents.push(studentId);
    seance.absentReasons[studentId] = status;
    if(seance.defisMatches && seance.defisMatches.length){
      seance.defisMatches = seance.defisMatches.filter(m=>!(m.winner===null && (m.a===studentId || m.b===studentId)));
      seance.defisMatches.forEach(m=>{ if(m.referee===studentId) m.referee = null; });
    }
  }
  saveState();
  if(seance.tournamentType === 'defisClassement' && seance.defisMatches && seance.defisMatches.length && rotationClassementTerminee(seance)){
    remplirTablesClassement(activite);
  }
  renderActivityTab(activite);
}
// Efface matchs/tours/poules de la séance en cours ET recalcule le total
// cumulé de la classe sans cette séance (les autres séances, elles, gardent
// leurs propres résultats).
function clearSeanceResults(activite){
  const cd = currentClasseData(activite);
  const seance = currentSeance(activite);
  if(!confirm('Effacer tous les résultats de cette séance (matchs, tours, poules) ? Le total cumulé de la classe sera recalculé sans cette séance. Cette action est irréversible.')) return;
  seance.teams = [];
  seance.poules = [];
  seance.matches = [];
  seance.hasardWins = {};
  seance.defisMatches = [];
  seance.defisBye = [];
  seance.lastAction = null;
  recomputeCumulativeTotals(cd);
  saveState();
  renderActivityTab(activite);
  renderGeneral();
}

function slug(s){
  return String(s || '')
    .normalize('NFD').replace(/[̀-ͯ]/g,'')
    .toLowerCase().replace(/[^a-z0-9]+/g,'');
}
function normalizeSexe(v){
  const s = String(v || '').trim().toUpperCase();
  if(s === 'F' || s === 'FILLE' || s === 'FEMININ' || s === 'FÉMININ') return 'F';
  if(s === 'G' || s === 'M' || s === 'GARCON' || s === 'GARÇON' || s === 'MASCULIN') return 'G';
  return s;
}
function sexeBadge(v){
  if(v==='F') return '<span class="badge sexeF">F</span>';
  if(v==='G') return '<span class="badge sexeG">G</span>';
  return '<span class="badge empty">—</span>';
}
function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function clamp(v,min,max){ return Math.min(max, Math.max(min, v)); }

/* ------------------------------------------------- SYNCHRONISATION CLOUD */
// Avec APPS_SCRIPT_URL renseigné (voir GoogleAppsScript.gs), les données se
// synchronisent automatiquement avec un Google Sheet : à l'ouverture de
// l'appli, la version la plus récente en ligne remplace la version locale
// (si elle est joignable) ; à chaque modification, la nouvelle version est
// envoyée en ligne quelques secondes plus tard (pour ne pas multiplier les
// envois à chaque clic). Fonctionne hors-ligne : sans réseau, l'appli
// continue avec la dernière version connue localement.
let cloudSyncTimer = null;
function setSyncStatus(state){
  const el = document.getElementById('syncStatus');
  if(!el) return;
  if(!APPS_SCRIPT_URL){ el.textContent = ''; el.className = 'sync-status'; return; }
  const labels = {
    loading: '🔄 Chargement…', ok: '☁️ Synchronisé', saving: '🔄 Enregistrement…',
    error: '⚠️ Hors ligne (données locales)',
  };
  el.textContent = labels[state] || '';
  el.className = 'sync-status' + (state === 'error' ? ' error' : (state === 'ok' ? ' ok' : ''));
}
function fetchWithTimeout(url, options, ms){
  return Promise.race([
    fetch(url, options),
    new Promise((_, reject)=> setTimeout(()=>reject(new Error('Délai dépassé')), ms)),
  ]);
}
async function loadCloudStateIfAvailable(){
  if(!APPS_SCRIPT_URL) return;
  setSyncStatus('loading');
  try{
    const res = await fetchWithTimeout(APPS_SCRIPT_URL + '?action=load', {}, 8000);
    const json = await res.json();
    if(json && json.ok && json.data){
      STATE = json.data;
      ensureActivityData();
      localStorage.setItem('gt_state', JSON.stringify(STATE));
    }
    setSyncStatus('ok');
  }catch(e){
    setSyncStatus('error');
  }
}
function scheduleCloudSync(){
  if(!APPS_SCRIPT_URL) return;
  clearTimeout(cloudSyncTimer);
  setSyncStatus('saving');
  cloudSyncTimer = setTimeout(pushCloudState, 2500);
}
async function pushCloudState(){
  try{
    await fetchWithTimeout(APPS_SCRIPT_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'}, // évite le préflight CORS
      body: JSON.stringify({ action:'save', data: STATE }),
    }, 10000);
    setSyncStatus('ok');
  }catch(e){
    setSyncStatus('error');
  }
}

/* --------------------------------------------------------- CSV IMPORT - */
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0; i<text.length; i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\n' || c === '\r'){
        if(c === '\r' && text[i+1] === '\n') i++;
        row.push(field); field='';
        rows.push(row); row=[];
      } else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length>1 || (r[0]||'').trim()!=='');
}

async function fetchCollegeList(){
  const res = await fetch(CSV_URL);
  if(!res.ok) throw new Error('Impossible de charger le fichier (vérifiez qu\'il est partagé "Toute personne disposant du lien peut consulter").');
  const text = await res.text();
  const rows = parseCSV(text);
  if(!rows.length) throw new Error('Fichier vide ou illisible.');
  const headers = rows[0].map(h => String(h).trim().toLowerCase());
  const idxNom = headers.indexOf('nom');
  const idxPrenom = headers.indexOf('prénom') >= 0 ? headers.indexOf('prénom') : headers.indexOf('prenom');
  const idxClasse = headers.indexOf('classe');
  const idxSexe = headers.findIndex(h => h.indexOf('sexe') === 0);
  if(idxNom < 0 || idxPrenom < 0 || idxClasse < 0){
    throw new Error('Colonnes Nom / Prénom / Classe introuvables dans le fichier.');
  }
  const list = [];
  for(let i=1; i<rows.length; i++){
    const row = rows[i];
    const nom = String(row[idxNom] || '').trim();
    const prenom = String(row[idxPrenom] || '').trim();
    const classe = String(row[idxClasse] || '').trim();
    const sexe = idxSexe >= 0 ? normalizeSexe(row[idxSexe]) : '';
    if(!nom || !prenom || !classe) continue;
    const nomPrenom = nom.toUpperCase() + ' ' + prenom;
    const id = slug(nomPrenom) + '_' + slug(classe);
    list.push({ id, nomPrenom, classe, sexe });
  }
  return list;
}

// Export Excel de l'historique des matchs de défis classement progressif de

function exportDefisMatchesExcel(activite){
  const cd = currentClasseData(activite);
  const seance = currentSeance(activite);
  if(!cd || !seance || !seance.defisMatches || !seance.defisMatches.length) return;
  const rows = seance.defisMatches.map(m=>({
    'Table': m.table,
    'Joueur A': participantLabel(activite, m.a),
    'Joueur B': participantLabel(activite, m.b),
    'Vainqueur': m.winner ? participantLabel(activite, m.winner) : '',
    'Arbitre': m.referee ? participantLabel(activite, m.referee) : 'Auto-arbitrage',
  }));
  exportRowsToExcel(rows, `defis_classement_${slug(activite)}_${slug(cd.classe)}_seance${seance.numero}.xlsx`, 'Matchs');
}
function exportClassementExcel(activite){
  const cd = currentClasseData(activite);
  if(!cd) return;
  const seance = currentSeance(activite);
  const typeCourant = seance ? seance.tournamentType : '';
  const modePoints = typeCourant === 'poule';
  const students = STATE.allStudents.filter(s=>s.classe===cd.classe);

  if(!modePoints){
    // Défis (hasard/classement progressif) : même détail que la carte à
    // l'écran, avec une colonne par séance de défis + le total.
    const seancesDefis = cd.seances.filter(s=> s.tournamentType==='defisHasard' || s.tournamentType==='defisClassement');
    const perSeance = seancesDefis.map(s=>computeSeanceDefisWins(s));
    const sorted = students.slice().sort((a,b)=>(cd.wins[b.id]||0)-(cd.wins[a.id]||0));
    const rows = sorted.map((s,i)=>{
      const row = { 'Rang':i+1, 'Nom Prénom':s.nomPrenom };
      seancesDefis.forEach((sc,idx)=>{ row['Séance '+sc.numero] = perSeance[idx][s.id]||0; });
      row['Total'] = cd.wins[s.id]||0;
      return row;
    });
    exportRowsToExcel(rows, `classement_cumule_${slug(activite)}_${slug(cd.classe)}.xlsx`, 'Classement');
    return;
  }

  // Tournoi par poule : son propre système de points (cd.poulePoints), qui
  // ne compte pas les résultats de la même façon (barème selon l'écart de
  // score) et n'a pas de détail séance par séance.
  const sorted = students.slice().sort((a,b)=>(cd.poulePoints[b.id]||0)-(cd.poulePoints[a.id]||0));
  const rows = sorted.map((s,i)=>({ 'Rang':i+1, 'Nom Prénom':s.nomPrenom, 'Points cumulés':cd.poulePoints[s.id]||0 }));
  exportRowsToExcel(rows, `classement_cumule_${slug(activite)}_${slug(cd.classe)}.xlsx`, 'Classement');
}

/* ------------------------------------------------------- POULES / EQUIPES */
function generateTeams(studentIds, joueursParEquipe){
  const shuffled = shuffleArray(studentIds);
  const teams = [];
  let idx=0, n=1;
  while(idx < shuffled.length){
    teams.push({ id:'equipe'+n, nom:'Équipe '+n, memberIds: shuffled.slice(idx, idx+joueursParEquipe) });
    idx += joueursParEquipe; n++;
  }
  return teams;
}
// Calcule la taille des poules à créer pour n participants, en respectant les
// bornes [min, max] de l'activité : priorité à la taille de base souhaitée,
// et absorption du reste par des poules d'une unité de plus (jamais de poule
// plus petite que min — par ex. jamais de poule à 2 si la base est 3 et que
// max autorise 4).
function computePouleSizes(n, base, min, max){
  if(n <= 0) return [];
  if(n <= max) return [n]; // un seul groupe suffit (même incomplet si n < min)
  const full = Math.floor(n / base);
  const r = n % base;
  if(r === 0) return Array(full).fill(base);
  if(base + 1 <= max && full >= r){
    return [...Array(full - r).fill(base), ...Array(r).fill(base + 1)];
  }
  // Repli : le reste ne peut pas être absorbé proprement avec base+1 ->
  // on répartit le plus uniformément possible dans les bornes [min, max].
  let groups = full > 0 ? full : 1;
  while(groups > 1){
    const q = Math.floor(n / groups), rem = n % groups;
    const big = q + 1, small = q;
    if(small >= min && big <= max){
      return [...Array(rem).fill(big), ...Array(groups - rem).fill(small)];
    }
    groups--;
  }
  return [n];
}
// wins fourni (optionnel) : trie par classement décroissant avant de répartir
// séquentiellement (Poule 1 = meilleurs, dernière poule = moins bons), comme
// demandé ("Table 1 = meilleurs élèves avec le plus de victoires"). Sans wins,
// répartition purement aléatoire. La taille de chaque poule s'ajuste
// automatiquement au nombre de participants (voir computePouleSizes).
function generatePoules(ids, taillePoule, wins, min, max){
  let ordered = shuffleArray(ids);
  if(wins){
    ordered = ordered.sort((a,b)=> (wins[b]||0) - (wins[a]||0));
  }
  const sizes = computePouleSizes(ordered.length, taillePoule, min || taillePoule, max || taillePoule);
  const poules = [];
  let idx = 0;
  sizes.forEach((size, i)=>{
    poules.push({ id:'poule'+(i+1), nom:'Poule '+(i+1), members: ordered.slice(idx, idx+size) });
    idx += size;
  });
  return poules;
}
function participantLabel(activite, id){
  const act = ACTIVITIES[activite];
  const seance = currentSeance(activite);
  if(act.type === 'equipe' && seance){
    const t = seance.teams.find(t=>t.id===id);
    if(t) return t.nom;
  }
  const s = STATE.allStudents.find(s=>s.id===id);
  return s ? s.nomPrenom : id;
}
function getPouleLabelForClasse(activite, cd, student){
  const act = ACTIVITIES[activite];
  const seance = cd.seances[cd.currentSeanceIndex] || cd.seances[cd.seances.length-1];
  if(!seance) return '';
  if(seance.tournamentType === 'poule'){
    if(!seance.poules.length) return '';
    if(act.type === 'individuel'){
      const p = seance.poules.find(p=>p.members.includes(student.id));
      return p ? p.nom : '';
    }
    const team = seance.teams.find(t=>t.memberIds.includes(student.id));
    if(!team) return '';
    const p = seance.poules.find(p=>p.members.includes(team.id));
    return p ? `${p.nom} (${team.nom})` : '';
  }
  if(seance.tournamentType === 'defisHasard' || seance.tournamentType === 'defisClassement'){
    const w = cd.wins[student.id] || 0;
    const label = seance.tournamentType === 'defisHasard' ? 'Défis hasard' : 'Défis classement';
    return `${label} — ${w} victoire${w>1?'s':''}`;
  }
  return '';
}
function getStudentAssignment(student){
  for(const activite of Object.keys(ACTIVITIES)){
    const data = STATE.activityData[activite];
    const cd = data.classes[student.classe];
    if(cd){
      return { activite, poule: getPouleLabelForClasse(activite, cd, student) };
    }
  }
  return { activite:'', poule:'' };
}
function getActiveStudents(){
  const activeClasses = new Set();
  Object.values(STATE.activityData).forEach(d=>{
    Object.keys(d.classes).forEach(c=>activeClasses.add(c));
  });
  return STATE.allStudents.filter(s=>activeClasses.has(s.classe));
}

function onGenererPoules(activite){
  const cd = currentClasseData(activite);
  const seance = currentSeance(activite);
  const act = ACTIVITIES[activite];
  if(!cd){ alert("Choisissez d'abord une classe."); return; }
  if(!seance){ alert("Créez d'abord une séance."); return; }
  const terrains = clamp(seance.pouleTerrains || act.pouleTerrainMin, act.pouleTerrainMin, act.pouleTerrainMax);
  const taillePoule = clamp(parseInt(document.getElementById('cfgTaillePoule').value, 10) || act.pouleMin, act.pouleMin, act.pouleMax);

  if(seance.poules.length){
    if(!confirm('Cela régénère les poules et efface les placements/matchs actuels de cette séance. Continuer ?')) return;
  }

  const studentIds = STATE.allStudents.filter(s=>s.classe===cd.classe && !seance.absents.includes(s.id)).map(s=>s.id);

  if(act.type === 'equipe'){
    const joueursParEquipe = clamp(parseInt(document.getElementById('cfgJoueursEquipe').value, 10) || 4, 2, 15);
    seance.config = { terrains, taillePoule, joueursParEquipe };
    seance.teams = generateTeams(studentIds, joueursParEquipe);
    seance.poules = generatePoules(seance.teams.map(t=>t.id), taillePoule, null, act.pouleMin, act.pouleMax);
  } else {
    seance.config = { terrains, taillePoule };
    seance.teams = [];
    const seanceIdx = cd.seances.indexOf(seance);
    const prevSeance = seanceIdx > 0 ? cd.seances[seanceIdx-1] : null;
    const prevHasResults = prevSeance && prevSeance.tournamentType === 'poule' && prevSeance.poules.length && prevSeance.matches.some(m=>m.winner);

    if(prevHasResults){
      // Montée-descente à partir du classement de la séance précédente.
      const assignment = computeMonteeDescente(prevSeance);
      const nbPoules = prevSeance.poules.length;
      const groups = Array.from({length:nbPoules}, ()=>[]);
      const unassigned = [];
      studentIds.forEach(id=>{
        if(assignment[id] !== undefined) groups[assignment[id]].push(id);
        else unassigned.push(id); // nouvel élève, ou absent la séance précédente
      });
      unassigned.forEach(id=>{
        let target = 0, min = Infinity;
        groups.forEach((g,i)=>{ if(g.length < min){ min = g.length; target = i; } });
        groups[target].push(id);
      });
      seance.poules = groups.map((members,i)=>({ id:'poule'+(i+1), nom:'Poule '+(i+1), members: shuffleArray(members) }));
    } else {
      // Pas de séance de poule précédente exploitable pour la montée-descente :
      // on se base sur le classement des défis (cd.wins) déjà accumulé par la
      // classe pour semer les meilleurs à la table 1, sinon aléatoire.
      seance.poules = generatePoules(studentIds, taillePoule, cd.wins, act.pouleMin, act.pouleMax);
    }
  }
  seance.matches = [];
  saveState();
  renderActivityTab(activite);
  renderGeneral();
}

function moveParticipant(activite, participantId, targetPouleId){
  const seance = currentSeance(activite);
  seance.poules.forEach(p=>{ p.members = p.members.filter(id=>id!==participantId); });
  const target = seance.poules.find(p=>p.id===targetPouleId);
  if(target) target.members.push(participantId);
  seance.matches = [];
  saveState();
  renderActivityTab(activite);
  renderGeneral();
}
function moveStudentTeam(activite, studentId, targetTeamId){
  const seance = currentSeance(activite);
  seance.teams.forEach(t=>{ t.memberIds = t.memberIds.filter(id=>id!==studentId); });
  const target = seance.teams.find(t=>t.id===targetTeamId);
  if(target) target.memberIds.push(studentId);
  seance.matches = [];
  saveState();
  renderActivityTab(activite);
  renderGeneral();
}
function renameTeam(activite, teamId, newName){
  const seance = currentSeance(activite);
  const t = seance.teams.find(t=>t.id===teamId);
  if(t){ t.nom = newName || t.nom; saveState(); renderGeneral(); }
}

// Barème de points selon l'écart de score (voir carte Règlement des feuilles
// PDF) : victoire ou défaite "large" (écart >= 5) rapporte respectivement 5
// ou 1 point ; victoire ou défaite "courte" (écart < 5) rapporte 3 ou 2
// points. Un score à égalité est refusé (il doit y avoir un vainqueur).
function computeMatchPoints(scoreA, scoreB){
  if(scoreA === scoreB) return null;
  const diff = Math.abs(scoreA - scoreB);
  const large = diff >= 5;
  const winnerIsA = scoreA > scoreB;
  const pointsWinner = large ? 5 : 3;
  const pointsLoser = large ? 1 : 2;
  return {
    winnerIsA,
    pointsA: winnerIsA ? pointsWinner : pointsLoser,
    pointsB: winnerIsA ? pointsLoser : pointsWinner,
  };
}
// Total de points marqués (barème ci-dessus) par membre d'une poule, à partir
// des matchs déjà résultés de cette séance.
function computePoulePoints(seance, poule){
  const totals = {};
  poule.members.forEach(id=>{ totals[id] = 0; });
  seance.matches.forEach(m=>{
    if(m.poule !== poule.nom || m.pointsA === undefined) return;
    if(totals[m.a] !== undefined) totals[m.a] += m.pointsA;
    if(totals[m.b] !== undefined) totals[m.b] += m.pointsB;
  });
  return totals;
}
// Points de poule marqués lors d'une séance donnée, toutes poules confondues.
function computeSeancePoulePoints(seance){
  const totals = {};
  (seance.poules||[]).forEach(p=>{
    const pts = computePoulePoints(seance, p);
    Object.keys(pts).forEach(id=>{ totals[id] = (totals[id]||0) + pts[id]; });
  });
  return totals;
}
// Recalcule cd.wins et cd.poulePoints depuis zéro en resommant toutes les
// séances de la classe (au lieu de simplement les remettre à zéro) : utilisé
// après avoir effacé ou supprimé une séance, pour que le total cumulé
// reflète exactement ce qu'il reste, sans effacer les autres séances.
function recomputeCumulativeTotals(cd){
  const wins = {};
  const poulePoints = {};
  cd.seances.forEach(s=>{
    const w = computeSeanceDefisWins(s);
    Object.keys(w).forEach(id=>{ wins[id] = (wins[id]||0) + w[id]; });
    const p = computeSeancePoulePoints(s);
    Object.keys(p).forEach(id=>{ poulePoints[id] = (poulePoints[id]||0) + p[id]; });
  });
  cd.wins = wins;
  cd.poulePoints = poulePoints;
}
// Classement (ordre décroissant de points marqués) des membres ACTIFS (non
// absents) d'une poule, à partir des matchs de cette séance.
function computePouleStanding(seance, poule){
  const totals = computePoulePoints(seance, poule);
  const actifs = poule.members.filter(id=>!seance.absents.includes(id));
  return actifs.slice().sort((a,b)=> (totals[b]||0) - (totals[a]||0));
}

// Reporte l'écart entre les anciens et les nouveaux points d'un match dans le
// total cumulé de la classe (cd.poulePoints), pour que le classement se
// poursuive d'une séance à l'autre — uniquement pour les activités
// individuelles (en équipe, les équipes sont reformées à chaque séance,
// cumuler des points par équipe n'aurait pas de sens).
function appliquerDeltaPoulePoints(activite, match, newPointsA, newPointsB){
  if(ACTIVITIES[activite].type !== 'individuel') return;
  const cd = currentClasseData(activite);
  const oldA = (match.pointsA !== undefined && match.pointsA !== null) ? match.pointsA : 0;
  const oldB = (match.pointsB !== undefined && match.pointsB !== null) ? match.pointsB : 0;
  cd.poulePoints[match.a] = Math.max(0, (cd.poulePoints[match.a]||0) - oldA + newPointsA);
  cd.poulePoints[match.b] = Math.max(0, (cd.poulePoints[match.b]||0) - oldB + newPointsB);
}
function validerScoreModal(){
  if(!scoreModalContext) return;
  const { activite, matchIndex } = scoreModalContext;
  const seance = currentSeance(activite);
  const match = seance.matches[matchIndex];
  if(!match) return;
  const scoreA = parseInt(document.getElementById('scoreModalScoreA').value, 10);
  const scoreB = parseInt(document.getElementById('scoreModalScoreB').value, 10);
  if(isNaN(scoreA) || isNaN(scoreB) || scoreA < 0 || scoreB < 0){ alert('Entrez les deux scores.'); return; }
  const result = computeMatchPoints(scoreA, scoreB);
  if(!result){ alert('Les deux scores ne peuvent pas être égaux : il doit y avoir un vainqueur.'); return; }
  appliquerDeltaPoulePoints(activite, match, result.pointsA, result.pointsB);
  match.scoreA = scoreA; match.scoreB = scoreB;
  match.pointsA = result.pointsA; match.pointsB = result.pointsB;
  match.winner = result.winnerIsA ? match.a : match.b;
  match.abandon = null;
  saveState();
  closeScoreModal();
  renderActivityTab(activite);
}
// Abandon d'un des deux participants : il marque 0 point, l'autre remporte le
// match avec le maximum (5 points), sans qu'un score n'ait besoin d'être saisi.
function abandonScoreModal(who){
  if(!scoreModalContext) return;
  const { activite, matchIndex } = scoreModalContext;
  const seance = currentSeance(activite);
  const match = seance.matches[matchIndex];
  if(!match) return;
  const newPointsA = who === 'a' ? 0 : 5;
  const newPointsB = who === 'a' ? 5 : 0;
  appliquerDeltaPoulePoints(activite, match, newPointsA, newPointsB);
  match.pointsA = newPointsA; match.pointsB = newPointsB;
  match.winner = who === 'a' ? match.b : match.a;
  match.scoreA = null; match.scoreB = null;
  match.abandon = who;
  saveState();
  closeScoreModal();
  renderActivityTab(activite);
}
// Montée-descente : le 1er d'une poule monte dans la poule au-dessus, le
// dernier descend dans la poule en-dessous, le reste (le "milieu") reste sur
// place. Poule 1 : seul le dernier descend. Dernière poule : seul le premier
// monte. Renvoie une map participantId -> index de poule cible (0-based).
function computeMonteeDescente(previousSeance){
  const poules = previousSeance.poules;
  const n = poules.length;
  const assignment = {};
  poules.forEach((p, idx)=>{
    const standing = computePouleStanding(previousSeance, p);
    if(!standing.length) return;
    if(standing.length === 1){
      assignment[standing[0]] = idx;
      return;
    }
    const premier = standing[0];
    const dernier = standing[standing.length-1];
    const milieu = standing.slice(1, -1);
    if(idx === 0){
      assignment[premier] = idx;
      milieu.forEach(id=>{ assignment[id] = idx; });
      assignment[dernier] = Math.min(idx+1, n-1);
    } else if(idx === n-1){
      assignment[premier] = Math.max(idx-1, 0);
      milieu.forEach(id=>{ assignment[id] = idx; });
      assignment[dernier] = idx;
    } else {
      assignment[premier] = idx-1;
      milieu.forEach(id=>{ assignment[id] = idx; });
      assignment[dernier] = idx+1;
    }
  });
  return assignment;
}

/* ------------------------------------------------------------ MATCHES - */
function roundRobinRounds(participants){
  let list = participants.slice();
  if(list.length < 2) return [];
  if(list.length % 2 === 1) list.push(null);
  const n = list.length;
  const fixed = list[0];
  let rest = list.slice(1);
  const rounds = [];
  for(let r=0; r<n-1; r++){
    const arr = [fixed, ...rest];
    const pairs = [];
    for(let i=0; i<n/2; i++){
      const a = arr[i], b = arr[n-1-i];
      if(a!==null && b!==null) pairs.push([a,b]);
    }
    rounds.push(pairs);
    rest.unshift(rest.pop());
  }
  return rounds;
}

// Aller-retour : chaque paire de la poule se rencontre deux fois (une fois
// dans chaque sens). Une poule de 3 fait donc 6 matchs, une poule de 4 en
// fait 12, etc. (le simple aller ferait 2 fois moins de matchs).
function onGenererMatchs(activite){
  const seance = currentSeance(activite);
  if(!seance || !seance.poules.length){ alert("Générez d'abord les poules."); return; }
  const pouleRounds = seance.poules.map(p => {
    const aller = roundRobinRounds(p.members);
    const retour = aller.map(round => round.map(([a,b])=>[b,a]));
    return [...aller, ...retour];
  });
  const maxRounds = Math.max(0, ...pouleRounds.map(r=>r.length));
  const matches = [];
  for(let round=0; round<maxRounds; round++){
    let counter = 0;
    seance.poules.forEach((p, pi)=>{
      const pairs = pouleRounds[pi][round] || [];
      pairs.forEach(([a,b])=>{
        const table = (counter % seance.config.terrains) + 1;
        const vague = Math.floor(counter / seance.config.terrains) + 1;
        matches.push({ poule:p.nom, tour:round+1, vague, table, a, b, winner:null });
        counter++;
      });
    });
  }
  seance.matches = matches;
  saveState();
  renderActivityTab(activite);
}

function addWin(activite, studentId){
  const cd = currentClasseData(activite);
  const seance = currentSeance(activite);
  cd.wins[studentId] = (cd.wins[studentId]||0) + 1;
  seance.hasardWins[studentId] = (seance.hasardWins[studentId]||0) + 1;
  saveState();
  renderActivityTab(activite);
  renderGeneral();
}
function undoWin(activite, studentId){
  const cd = currentClasseData(activite);
  const seance = currentSeance(activite);
  const cur = cd.wins[studentId]||0;
  if(cur>0) cd.wins[studentId] = cur - 1;
  const curSeance = seance.hasardWins[studentId]||0;
  if(curSeance>0) seance.hasardWins[studentId] = curSeance - 1;
  saveState();
  renderActivityTab(activite);
  renderGeneral();
}

/* --------------------------------------------------- DEFIS CLASSEMENT - */
// Flux continu : les élèves ayant le même nombre de victoires (classement
// porté par la classe : continuité assurée d'une séance à l'autre) sont
// appariés table par table. Dès qu'un résultat est enregistré sur une table,
// celle-ci se libère et un nouveau match y est aussitôt organisé avec les
// élèves disponibles ayant le même nombre de victoires — sans notion de
// "tour" ni de "vague" à gérer manuellement. Chaque match affiche le numéro
// de match de chacun des deux élèves (1er match, 2e match…), en veillant à
// donner la priorité à ceux qui ont joué le moins de matchs, pour que tout
// le monde en joue toujours le même nombre. Le surplus impair d'un groupe de
// victoires est reporté sur le groupe immédiatement supérieur ; s'il en
// reste un tout seul, il est exempté en attendant un adversaire. Un match
// n'est créé que si un arbitre dédié peut lui être garanti (jamais partagé
// entre deux tables simultanées) : une table peut donc rester vide s'il n'y
// a pas assez d'élèves disponibles pour lui assurer un arbitre.
function ordinalMatch(n){
  return n===1 ? '1er match' : n+'e match';
}
function defisCapacite(seance){
  return (seance.defisTerrains||1) * (seance.demiTerrain ? 2 : 1);
}
function defisMatchCount(seance, studentId){
  return seance.defisMatches.filter(m=>m.a===studentId || m.b===studentId).length;
}
// Vrai si tous les matchs déjà créés cette séance ont un vainqueur (donc
// aucune table n'est encore occupée) : on n'organise la rotation suivante
// qu'une fois la rotation en cours entièrement terminée par tout le monde,
// plutôt que de faire avancer chaque table indépendamment à son rythme.
function rotationClassementTerminee(seance){
  return seance.defisMatches.every(m=>m.winner !== null);
}
function remplirTablesClassement(activite){
  const cd = currentClasseData(activite);
  const seance = currentSeance(activite);
  if(!seance.defisTerrains){ alert('Choisissez le nombre de tables/terrains disponibles.'); return; }
  if(!seance.defisMatches) seance.defisMatches = [];
  const capacite = defisCapacite(seance);
  const students = STATE.allStudents.filter(s=>s.classe===cd.classe && !seance.absents.includes(s.id)).map(s=>s.id);

  const unresolved = seance.defisMatches.filter(m=>m.winner===null);
  const occupiedTables = new Set(unresolved.map(m=>m.table));
  // Un élève déjà joueur OU déjà arbitre d'un match en cours n'est disponible
  // ni pour jouer ni pour arbitrer ailleurs tant que ce match n'est pas résolu.
  const busy = new Set();
  unresolved.forEach(m=>{
    busy.add(m.a); busy.add(m.b);
    if(m.referee) busy.add(m.referee);
  });

  const freeTables = [];
  for(let t=1; t<=capacite; t++){ if(!occupiedTables.has(t)) freeTables.push(t); }
  if(!freeTables.length){ saveState(); return; }

  const available = students.filter(id=>!busy.has(id));
  const groups = {};
  available.forEach(id=>{
    const w = cd.wins[id]||0;
    (groups[w] = groups[w]||[]).push(id);
  });
  Object.keys(groups).forEach(k=>{
    // priorité à ceux qui ont joué le moins de matchs, pour égaliser le nombre de matchs de chacun
    groups[k] = shuffleArray(groups[k]).sort((x,y)=> defisMatchCount(seance,x) - defisMatchCount(seance,y));
  });
  // Dernier adversaire rencontré par chaque élève (pour éviter une revanche
  // immédiate, le même duel deux fois de suite).
  const lastOpponent = {};
  for(let i = seance.defisMatches.length - 1; i >= 0; i--){
    const m = seance.defisMatches[i];
    if(lastOpponent[m.a] === undefined) lastOpponent[m.a] = m.b;
    if(lastOpponent[m.b] === undefined) lastOpponent[m.b] = m.a;
  }
  // Appariement PRIORITAIREMENT à l'intérieur de chaque groupe de même
  // nombre de victoires (jamais de report vers un groupe voisin à ce stade) :
  // un élève seul dans son groupe reste exempté (bye) en attendant un
  // adversaire à égalité.
  const pairs = [];
  const byes = [];
  Object.keys(groups).map(Number).forEach(k=>{
    const pool = groups[k];
    while(pool.length >= 2){
      const a = pool.shift();
      let idx = pool.findIndex(id => lastOpponent[a] !== id);
      if(idx === -1) idx = 0; // pas d'autre choix : on rejoue le même duel
      const b = pool.splice(idx, 1)[0];
      pairs.push([a, b]);
    }
    if(pool.length === 1) byes.push(pool[0]);
  });

  // Repli de souplesse (priorité basse, seulement pour ne pas rester bloqué) :
  // un élève encore seul après le passage ci-dessus peut exceptionnellement
  // affronter quelqu'un ayant une victoire de plus ou de moins — jamais un
  // écart plus grand. S'il n'y a même pas ça, il reste exempté. Comme pour
  // l'appariement strict, on évite la revanche immédiate contre le dernier
  // adversaire dès qu'un autre choix à ±1 victoire existe — sans ça, deux
  // élèves isolés à eux deux se retrouvaient rejoués en boucle l'un contre
  // l'autre à chaque match.
  const stillByes = [];
  while(byes.length){
    const a = byes.shift();
    let idx = byes.findIndex(id => Math.abs((cd.wins[id]||0) - (cd.wins[a]||0)) === 1 && lastOpponent[a] !== id);
    if(idx === -1) idx = byes.findIndex(id => Math.abs((cd.wins[id]||0) - (cd.wins[a]||0)) === 1);
    if(idx === -1){ stillByes.push(a); continue; }
    const b = byes.splice(idx, 1)[0];
    pairs.push([a, b]);
  }
  seance.defisBye = stillByes;

  // Priorité GLOBALE (tous groupes de victoires confondus) aux paires dont
  // les deux élèves ont joué le moins de matchs : sans ça, quand les tables
  // manquent pour tout le monde, le groupe des 0 victoires (souvent le plus
  // grand, avec les nouveaux entrants) passe toujours avant les groupes de
  // victoires supérieures, qui finissent par prendre du retard en nombre de
  // matchs joués.
  pairs.sort((p1, p2)=>{
    const m1 = Math.min(defisMatchCount(seance,p1[0]), defisMatchCount(seance,p1[1]));
    const m2 = Math.min(defisMatchCount(seance,p2[0]), defisMatchCount(seance,p2[1]));
    return m1 - m2;
  });

  // On privilégie un arbitre dédié (unique, jamais partagé entre deux tables
  // en même temps, jamais aussi joueur ailleurs) quand assez d'élèves sont
  // disponibles pour ça (2 joueurs + 1 arbitre). S'il n'en reste plus assez
  // (typiquement : il ne reste que 2 élèves à égalité de victoires et
  // personne d'autre), le match se joue quand même, en auto-arbitrage.
  const matchesACreer = Math.min(freeTables.length, pairs.length);
  const chosenPairs = pairs.slice(0, matchesACreer);

  const usedInPairs = new Set();
  chosenPairs.forEach(([a,b])=>{ usedInPairs.add(a); usedInPairs.add(b); });
  const refPool = shuffleArray(available.filter(id=>!usedInPairs.has(id)));
  chosenPairs.forEach(([a,b], i)=>{
    const table = freeTables[i];
    const numA = defisMatchCount(seance,a) + 1;
    const numB = defisMatchCount(seance,b) + 1;
    const referee = refPool[i] || null; // undefined une fois le vivier épuisé -> auto-arbitrage
    seance.defisMatches.push({ table, a, b, winner:null, referee, numA, numB });
  });
  saveState();
}
function enregistrerVainqueur(activite, matchIndex, winnerId){
  const cd = currentClasseData(activite);
  const seance = currentSeance(activite);
  const match = seance.defisMatches[matchIndex];
  if(!match) return;
  if(match.winner === winnerId){
    match.winner = null; // reclique sur le même = annule
    seance.lastAction = null;
    saveState();
    renderActivityTab(activite);
    renderGeneral();
    return;
  }
  const previousWinner = match.winner;
  if(previousWinner) cd.wins[previousWinner] = Math.max(0, (cd.wins[previousWinner]||0) - 1);
  match.winner = winnerId;
  cd.wins[winnerId] = (cd.wins[winnerId]||0) + 1;
  // On attend que TOUTE la rotation en cours soit terminée (plus aucun match
  // sans vainqueur) avant d'organiser la rotation suivante pour tout le
  // monde d'un coup — plus simple à suivre que des tables qui avancent
  // chacune à leur rythme. On retient ce qui vient de se passer (ancien/
  // nouveau vainqueur, matchs créés le cas échéant) pour pouvoir tout
  // annuler d'un coup avec le bouton "Annuler le dernier résultat".
  const countBefore = seance.defisMatches.length;
  if(rotationClassementTerminee(seance)){
    remplirTablesClassement(activite);
  }
  const createdIndexes = [];
  for(let i=countBefore; i<seance.defisMatches.length; i++) createdIndexes.push(i);
  seance.lastAction = { matchIndex, previousWinner, newWinner: winnerId, createdIndexes };
  saveState();
  renderActivityTab(activite);
  renderGeneral();
}
// Annule le dernier résultat enregistré en défis classement progressif :
// supprime le(s) match(s) créé(s) en cascade suite à ce résultat, restaure
// le vainqueur précédent du match concerné (ou le remet non-joué) et
// réajuste le total de victoires en conséquence. Ne permet d'annuler que la
// toute dernière action (pas d'historique multi-niveaux).
function undoLastDefisAction(activite){
  const seance = currentSeance(activite);
  const cd = currentClasseData(activite);
  const action = seance.lastAction;
  if(!action) return;
  action.createdIndexes.slice().sort((a,b)=>b-a).forEach(idx=>{
    seance.defisMatches.splice(idx, 1);
  });
  const match = seance.defisMatches[action.matchIndex];
  if(match){
    cd.wins[action.newWinner] = Math.max(0, (cd.wins[action.newWinner]||0) - 1);
    if(action.previousWinner) cd.wins[action.previousWinner] = (cd.wins[action.previousWinner]||0) + 1;
    match.winner = action.previousWinner || null;
  }
  seance.lastAction = null;
  saveState();
  renderActivityTab(activite);
  renderGeneral();
}

/* --------------------------------------------------------- RENDERING -- */
function renderTabs(){
  const nav = document.getElementById('tabsNav');
  const tabs = [{id:'general', label:'Général', icon:''}, ...Object.keys(ACTIVITIES).map(a=>({id:a, label:a, icon:ACTIVITIES[a].icon}))];
  nav.innerHTML = tabs.map(t=>`<button data-tab="${t.id}" class="${t.id===currentTab?'active':''}">${t.icon?t.icon+' ':''}${t.label}</button>`).join('');
  nav.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      currentTab = btn.dataset.tab;
      nav.querySelectorAll('button').forEach(b=>b.classList.toggle('active', b===btn));
      document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
      const panel = document.getElementById('panel-'+slug(currentTab));
      if(panel) panel.classList.add('active');
      if(currentTab==='general') renderGeneral(); else renderActivityTab(currentTab);
    });
  });
}

function renderAll(){
  renderGeneral();
  Object.keys(ACTIVITIES).forEach(a=>renderActivityTab(a));
}

/* Générique : tableau triable/filtrable */
function buildTable(tableId, columns, rows){
  if(!tableState[tableId]) tableState[tableId] = {sortKey:'nomPrenom', sortDir:1, filters:{}};
  const st = tableState[tableId];

  let filtered = rows.filter(r=>{
    return columns.every(col=>{
      const f = st.filters[col.key];
      if(!f) return true;
      const val = String(col.getValue(r) ?? '').toLowerCase();
      return val.includes(String(f).toLowerCase());
    });
  });

  if(st.sortKey){
    const col = columns.find(c=>c.key===st.sortKey);
    if(col){
      filtered.sort((a,b)=>{
        const va = String(col.getValue(a) ?? '');
        const vb = String(col.getValue(b) ?? '');
        return va.localeCompare(vb, 'fr') * st.sortDir;
      });
    }
  }

  const headerCells = columns.map((col,i)=>{
    const color = PALETTE[i % PALETTE.length];
    const arrow = st.sortKey===col.key ? (st.sortDir===1?'▲':'▼') : '';
    return `<th style="background:${color}" data-key="${col.key}">${col.label}<span class="arrow">${arrow}</span></th>`;
  }).join('');

  const filterCells = columns.map(col=>{
    if(col.filterType==='select'){
      const options = (col.filterOptions||[]).map(o=>`<option value="${o}" ${st.filters[col.key]===o?'selected':''}>${o}</option>`).join('');
      return `<th><select data-filter-key="${col.key}"><option value="">Tous</option>${options}</select></th>`;
    }
    if(col.filterType===false) return `<th></th>`;
    return `<th><input type="text" data-filter-key="${col.key}" value="${st.filters[col.key]||''}" placeholder="Filtrer..."></th>`;
  }).join('');

  const bodyRows = filtered.length ? filtered.map(row=>{
    const cells = columns.map(col=>`<td>${col.render ? col.render(row) : (col.getValue(row) ?? '')}</td>`).join('');
    return `<tr>${cells}</tr>`;
  }).join('') : `<tr><td colspan="${columns.length}" class="empty-state">Aucun élève ne correspond.</td></tr>`;

  return `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>${headerCells}</tr>
          <tr class="filters">${filterCells}</tr>
        </thead>
        <tbody>${bodyRows}</tbody>
      </table>
    </div>`;
}
function wireTable(container, tableId, columns, rerender){
  const st = tableState[tableId];
  container.querySelectorAll('thead th[data-key]').forEach(th=>{
    th.addEventListener('click', ()=>{
      const key = th.dataset.key;
      if(st.sortKey===key) st.sortDir *= -1; else { st.sortKey = key; st.sortDir = 1; }
      rerender();
    });
  });
  container.querySelectorAll('[data-filter-key]').forEach(el=>{
    el.addEventListener(el.tagName==='SELECT' ? 'change':'input', ()=>{
      st.filters[el.dataset.filterKey] = el.value;
      rerender();
    });
  });
}

/* Générique : rangée de cases à cocher exclusives pour choisir un nombre */
function checkboxRangeHtml(groupId, label, min, max, current){
  const opts = [];
  for(let v=min; v<=max; v++){
    const checked = current === v;
    opts.push(`
      <label class="cb-opt ${checked?'checked':''}">
        <input type="checkbox" data-cb-value="${v}" ${checked?'checked':''}>
        <span class="code">${v}</span>
      </label>`);
  }
  return `
    <div class="field-row-cb">
      <label>${label}</label>
      <div class="cb-group" id="${groupId}">${opts.join('')}</div>
    </div>`;
}
function wireCheckboxRange(groupId, onSelect){
  const group = document.getElementById(groupId);
  if(!group) return;
  const boxes = group.querySelectorAll('input[type=checkbox]');
  boxes.forEach(input=>{
    input.addEventListener('change', ()=>{
      if(input.checked){
        boxes.forEach(other=>{ if(other!==input) other.checked = false; });
        onSelect(parseInt(input.dataset.cbValue, 10));
      } else {
        onSelect(0);
      }
      group.querySelectorAll('.cb-opt').forEach(lbl=>{
        lbl.classList.toggle('checked', lbl.querySelector('input').checked);
      });
    });
  });
}

/* --------------------------------------------------------- SAUVEGARDE - */
// Les données sont stockées uniquement dans le navigateur de cet ordinateur
// (localStorage) : elles ne se transfèrent pas automatiquement vers un autre
// ordinateur. Ces deux fonctions permettent d'exporter un fichier de
// sauvegarde (à envoyer par email/clé USB/OneDrive) puis de le recharger sur
// un autre poste pour retrouver l'intégralité des données.
function exportBackupJSON(){
  const blob = new Blob([JSON.stringify(STATE, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const date = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `sauvegarde_gestion_tournois_${date}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importBackupJSON(file){
  if(!file) return;
  if(!confirm("Restaurer cette sauvegarde va remplacer toutes les données actuellement enregistrées sur cet ordinateur. Continuer ?")) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!data || typeof data !== 'object' || !Array.isArray(data.allStudents)){
        alert("Ce fichier ne ressemble pas à une sauvegarde valide.");
        return;
      }
      STATE = data;
      saveState();
      renderTabs();
      renderAll();
      alert('Sauvegarde restaurée avec succès.');
    } catch(e){
      alert("Impossible de lire ce fichier : " + e.message);
    }
  };
  reader.readAsText(file);
}
function renderSauvegardeCard(){
  return `
    <div class="card">
      <h3>💾 Sauvegarde et transfert vers un autre ordinateur</h3>
      <p class="hint">Les données sont enregistrées uniquement sur cet ordinateur (dans ce navigateur). Pour les récupérer sur un autre poste : exportez un fichier ici, transférez-le (clé USB, email, OneDrive...), puis importez-le sur l'autre ordinateur.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn secondary" id="btnExportBackup">⬇️ Exporter une sauvegarde</button>
        <button class="btn ghost" id="btnImportBackupTrigger">⬆️ Importer une sauvegarde</button>
        <input type="file" id="inputImportBackup" accept="application/json" hidden>
      </div>
    </div>`;
}
function wireSauvegardeCard(){
  document.getElementById('btnExportBackup').addEventListener('click', exportBackupJSON);
  const input = document.getElementById('inputImportBackup');
  document.getElementById('btnImportBackupTrigger').addEventListener('click', ()=>input.click());
  input.addEventListener('change', ()=>{
    if(input.files[0]) importBackupJSON(input.files[0]);
    input.value = '';
  });
}

function renderActivityTab(activite){
  const panel = document.getElementById('panel-'+slug(activite));
  if(!panel) return;
  const act = ACTIVITIES[activite];
  const data = STATE.activityData[activite];
  const classesDisponibles = [...new Set(STATE.allStudents.map(s=>s.classe))].sort((a,b)=>a.localeCompare(b,'fr'));
  const classesChargees = Object.keys(data.classes).sort((a,b)=>a.localeCompare(b,'fr'));

  let html = `
    <div class="activity-header-layout">
      <div class="card activity-import-card">
        <h3>${act.icon} ${activite}</h3>
        <div class="config-grid">
          <div class="field">
            <label>Classe à importer</label>
            <select id="selectClasse" ${!classesDisponibles.length?'disabled':''}>
              <option value="">— Choisir —</option>
              ${classesDisponibles.map(c=>`<option value="${c}">${c}</option>`).join('')}
            </select>
          </div>
        </div>
        <button class="btn" id="btnImporterClasse" ${!classesDisponibles.length?'disabled':''}>Charger cette classe</button>
        ${!classesDisponibles.length ? '<div class="hint">Chargez d\'abord la liste des élèves depuis l\'onglet Général.</div>' : ''}
      </div>
      ${classesChargees.map((c,i)=>`<button class="card classe-card ${c===data.currentClasse?'active':''}" style="background:${PALETTE[i % PALETTE.length]}" data-classe-select="${c}">${c}</button>`).join('')}
    </div>`;

  const cd = currentClasseData(activite);
  if(cd){
    const students = STATE.allStudents.filter(s=>s.classe===cd.classe);
    const filles = students.filter(s=>s.sexe==='F').length;
    const garcons = students.filter(s=>s.sexe==='G').length;

    html += `
      <div class="chip-row">
        <div class="chip" style="background:var(--c1)"><b>${students.length}</b>Élèves</div>
        <div class="chip" style="background:var(--c3)"><b>${filles}</b>Filles</div>
        <div class="chip" style="background:var(--c6)"><b>${garcons}</b>Garçons</div>
      </div>`;

    // Le classement total cumule d'une séance à l'autre : les défis hasard
    // et défis classement progressif partagent le même total de victoires
    // (cd.wins) — une victoire compte pareil quel que soit le format du
    // moment — tandis que le tournoi par poule a son propre système de
    // points (cd.poulePoints), car son barème (points selon l'écart de
    // score) n'a rien à voir avec un simple décompte de victoires. Sert
    // aussi à la continuité (montée-descente / appariement par nombre de
    // victoires) d'une séance à l'autre.
    const seancePourClassement = currentSeance(activite);
    const typeCourant = seancePourClassement ? seancePourClassement.tournamentType : '';
    const modePoints = typeCourant === 'poule';
    const totalMap = modePoints ? cd.poulePoints : cd.wins;
    const totalLabel = modePoints ? 'points' : 'victoires';
    // Pour les défis (hasard/classement progressif), le classement total est
    // déjà inclus (colonne "Total") dans la carte "Classement détaillé —
    // victoires séance par séance" plus bas : pas besoin de le répéter ici.
    const tournoiActif = typeCourant === 'poule';
    if(tournoiActif){
      const showTotal = !!cd.showClassementTotal;
      html += `
        <div class="card classement-total-card">
          <div class="toolbar">
            <h3>📊 Classement total — ${totalLabel} depuis le début du cycle</h3>
            <div style="display:flex;gap:6px;">
              ${showTotal ? '<button class="btn secondary small" id="btnExportClassement">📊 Exporter Excel</button>' : ''}
              <button class="btn ghost small" id="btnToggleClassementTotal">${showTotal ? '🙈 Masquer' : '👁️ Afficher'}</button>
            </div>
          </div>
          ${showTotal ? `
          <p class="hint">Ce total additionne les ${totalLabel} de toutes les séances de cette classe depuis le début du cycle (remis à zéro seulement si toutes les séances sont supprimées, ou via "Effacer les résultats").</p>
          ${renderClassementTable(students, totalMap)}` : ''}
        </div>`;
    }

    // Classement détaillé des défis (hasard/classement progressif) : une
    // colonne par séance + le total, affiché tout en haut (au-dessus des
    // onglets de séance) pour qu'il soit visible quelle que soit la séance
    // consultée, avec la même possibilité de masquer que le classement total.
    if(typeCourant === 'defisHasard' || typeCourant === 'defisClassement'){
      const showTotal = !!cd.showClassementTotal;
      html += `
        <div class="card classement-total-card">
          <div class="toolbar">
            <h3>🏅 Classement détaillé — victoires séance par séance</h3>
            <div style="display:flex;gap:6px;">
              ${showTotal ? '<button class="btn secondary small" id="btnExportClassement">📊 Exporter Excel</button>' : ''}
              <button class="btn ghost small" id="btnToggleClassementTotal">${showTotal ? '🙈 Masquer' : '👁️ Afficher'}</button>
            </div>
          </div>
          ${showTotal ? `
          <p class="hint">Une colonne par séance de défis (hasard ou classement progressif), et le total cumulé à droite. C'est ce total qui détermine qui affronte qui (seuls les élèves à égalité de victoires se rencontrent).</p>
          ${renderClassementParSeance(cd, students)}` : ''}
        </div>`;
    }

    // Classement de la séance en cours uniquement (2e colonne demandée),
    // agrégé sur toutes les poules de la classe pour le tournoi par poule.
    if(modePoints && seancePourClassement.poules && seancePourClassement.poules.length){
      const seanceTotals = {};
      seancePourClassement.poules.forEach(p=>{
        const pts = computePoulePoints(seancePourClassement, p);
        Object.keys(pts).forEach(id=>{ seanceTotals[id] = (seanceTotals[id]||0) + pts[id]; });
      });
      html += `
        <div class="card">
          <h3>🏅 Classement de cette séance (points de cette séance uniquement)</h3>
          ${renderClassementTable(students, seanceTotals)}
        </div>`;
    }

    html += `
      <div class="card">
        <div class="toolbar" style="margin-bottom:0;">
          <div class="seance-tabs">
            ${cd.seances.length
              ? cd.seances.map((s,i)=>`<button class="${i===cd.currentSeanceIndex?'active':''}" data-seance-index="${i}">Séance ${s.numero}</button>`).join('')
              : '<span class="muted">Aucune séance pour l\'instant</span>'}
          </div>
          <div style="display:flex;gap:6px;">
            <button class="btn small secondary" id="btnNouvelleSeance">➕ Nouvelle séance</button>
            ${cd.seances.length ? '<button class="btn small danger" id="btnSupprimerSeance">🗑️ Supprimer la séance</button>' : ''}
          </div>
        </div>
      </div>`;

    const seance = currentSeance(activite);
    if(seance){
      html += renderPresenceCard(activite, students, seance);

      if(!act.defisAllowed && !seance.tournamentType){
        seance.tournamentType = 'poule';
        saveState();
      }

      if(act.defisAllowed){
        html += `
          <div class="card">
            <div class="toolbar">
              <h3>Type de tournoi</h3>
              ${cd.seances.length ? '<button class="btn small ghost" id="btnEffacerResultats">🧹 Effacer les résultats</button>' : ''}
            </div>
            <div class="config-grid">
              <button class="btn ${seance.tournamentType==='poule'?'':'ghost'}" data-tournament-type="poule">🏆 Par poule</button>
              <button class="btn ${seance.tournamentType==='defisClassement'?'':'ghost'}" data-tournament-type="defisClassement">📈 Défis classement progressif</button>
              <button class="btn ${seance.tournamentType==='defisHasard'?'':'ghost'}" data-tournament-type="defisHasard">🎲 Défis hasard</button>

            </div>
