// Chaque motif d'exclusion a le même effet (l'élève ne joue pas) mais un
// libellé/couleur différent sur la pastille, pour garder une trace du motif.
const PRESENCE_STATUTS = {
  absent: { icon:'🚫', label:'ABS', cls:'absent' },
  materiel: { icon:'🎽', label:'MAT', cls:'materiel' },
  dispense: { icon:'📄', label:'DISP', cls:'dispense' },
};
function renderPresenceCard(activite, students, seance){
  const presents = students.filter(s=>!seance.absents.includes(s.id)).length;
  const reasons = seance.absentReasons || {};
  return `
    <div class="card">
      <h3>🧍 Présence — Séance ${seance.numero} <span class="muted">(${presents}/${students.length} présents)</span></h3>
      <p class="hint">Cliquez sur un élève pour choisir son statut (absent, matériel manquant, dispensé) et l'exclure des poules/défis de cette séance.</p>
      <div class="presence-list">
        ${students.map(s=>{
          const statut = reasons[s.id] && PRESENCE_STATUTS[reasons[s.id]];
          const label = statut ? `${statut.icon} ${statut.label}` : '✅';
          return `<button class="presence-chip ${statut?statut.cls:''}" data-open-presence="${s.id}">${label} ${s.nomPrenom}</button>`;
        }).join('')}
      </div>
    </div>`;
}

function renderPouleConfigCard(activite){
  const act = ACTIVITIES[activite];
  const seance = currentSeance(activite);
  const cfg = seance.config || {};
  let fields = checkboxRangeHtml('pouleTerrainCbGroup', act.terrainLabel+' disponibles', act.pouleTerrainMin, act.pouleTerrainMax, seance.pouleTerrains || act.pouleTerrainMin);
  if(act.type === 'equipe'){
    fields += `
      <div class="config-grid">
        <div class="field">
          <label>Joueurs par équipe</label>
          <input type="number" id="cfgJoueursEquipe" min="2" max="15" value="${cfg.joueursParEquipe || 4}">
        </div>
        <div class="field">
          <label>Équipes par poule</label>
          <input type="number" id="cfgTaillePoule" min="${act.pouleMin}" max="${act.pouleMax}" value="${cfg.taillePoule || act.pouleMin}">
          <div class="hint">de ${act.pouleMin} à ${act.pouleMax}</div>
        </div>
      </div>`;
  } else {
    fields += `
      <div class="config-grid">
        <div class="field">
          <label>Joueurs par poule</label>
          <input type="number" id="cfgTaillePoule" min="${act.pouleMin}" max="${act.pouleMax}" value="${cfg.taillePoule || act.pouleMin}">
          <div class="hint">de ${act.pouleMin} à ${act.pouleMax}</div>
        </div>
      </div>`;
  }
  return `
    <div class="card">
      <h3>⚙️ Configuration de la poule</h3>
      ${fields}
      <button class="btn" id="btnGenererPoules">🎲 Générer les poules</button>
      <p class="hint" style="margin-top:8px;">Le nombre de poules s'ajuste automatiquement au nombre de participants présents : priorité à des poules de ${act.pouleMin}, complétées si besoin par une ou plusieurs poules de ${act.pouleMin+1} — jamais de poule à ${act.pouleMin-1}.</p>
    </div>`;
}

function renderTeamsSection(activite){
  const act = ACTIVITIES[activite];
  const seance = currentSeance(activite);
  if(act.type !== 'equipe' || !seance.teams.length) return '';
  return `
    <div class="card">
      <h3>👥 Équipes</h3>
      <div class="teams-grid">

          <div class="team-card">
            <input class="team-name" data-team-name="${t.id}" value="${t.nom}">
            <ul>
              ${t.memberIds.map(mid=>{
                const student = STATE.allStudents.find(s=>s.id===mid);
                if(!student) return '';
                return `<li>${student.nomPrenom}
                  <select data-move-student="${mid}">
                    ${seance.teams.map(t2=>`<option value="${t2.id}" ${t2.id===t.id?'selected':''}>${t2.nom}</option>`).join('')}

function renderPoulesSection(activite){
  const seance = currentSeance(activite);
  if(!seance.poules.length) return '';
  const act = ACTIVITIES[activite];
  return `
    <div class="card">
      <h3>🏆 Poules</h3>
      ${seance.matches.some(m=>m.winner) ? `<p class="hint">Classement basé sur les matchs déjà enregistrés — servira à la montée-descente de la prochaine séance.</p>` : ''}
      <div class="poules-grid">
        ${seance.poules.map(p=>{
          const standing = computePouleStanding(seance, p);
          const totals = computePoulePoints(seance, p);
          const absentsDeLaPoule = p.members.filter(id=>seance.absents.includes(id));
          return `
          <div class="poule-card">
            <h4>${p.nom} (${p.members.length})</h4>
            <ul>
              ${standing.map((mid,rank)=>{
                const pts = totals[mid]||0;
                return `<li>${rank+1}. ${participantLabel(activite, mid)} <span class="muted">(${pts}pts)</span>
                  <select data-move-participant="${mid}">
                    ${seance.poules.map(p2=>`<option value="${p2.id}" ${p2.id===p.id?'selected':''}>${p2.nom}</option>`).join('')}
                  </select>
                </li>`;
              }).join('')}
              ${absentsDeLaPoule.map(mid=>`
                <li style="opacity:.55;text-decoration:line-through;">${participantLabel(activite, mid)} (absent)
                  <select data-move-participant="${mid}">
                    ${seance.poules.map(p2=>`<option value="${p2.id}" ${p2.id===p.id?'selected':''}>${p2.nom}</option>`).join('')}
                  </select>
                </li>`).join('')}
            </ul>
          </div>`;
        }).join('')}
      </div>
      <button class="btn secondary" id="btnGenererMatchs">📅 Générer les matchs (aller-retour)</button>
      <p class="hint" style="margin-top:8px;">Chaque paire de la poule se rencontre deux fois (aller puis retour) : une poule de 3 fait 6 matchs, une poule de 4 en fait 12.</p>
    </div>`;
}

// Les matchs à faire sont regroupés par table (une colonne par table), avec
// pour chacune la liste ordonnée de ses matchs (tous tours confondus) en
// dessous — plus lisible qu'un long tableau à parcourir ligne par ligne.
function renderMatchesSection(activite){
  const seance = currentSeance(activite);
  if(!seance.matches.length) return '';
  const act = ACTIVITIES[activite];
  const withIndex = seance.matches.map((m,idx)=>Object.assign({}, m, {idx}));
  const byTable = {};
  withIndex.forEach(m=>{ (byTable[m.table] = byTable[m.table]||[]).push(m); });
  const tables = Object.keys(byTable).map(Number).sort((a,b)=>a-b);

  const tableCards = tables.map(t=>{
    const matches = byTable[t].slice().sort((a,b)=> a.tour-b.tour || a.vague-b.vague);
    const pouleName = matches[0] ? matches[0].poule : '';
    const poule = seance.poules.find(p=>p.nom===pouleName);
    const standing = poule ? computePouleStanding(seance, poule) : [];
    const totals = poule ? computePoulePoints(seance, poule) : {};
    const playersSummary = standing.map(id=>`<span>${participantLabel(activite, id)} <b>${totals[id]||0}pts</b></span>`).join('');
    const rows = matches.map((m,i)=>{
      const joue = m.pointsA !== undefined && m.pointsA !== null;
      const scoreLabel = m.abandon ? '(abandon)' : (joue ? `${m.scoreA} - ${m.scoreB}` : 'vs');
      return `
      <div class="match-row" data-open-score="${m.idx}">
        <span class="tour-badge">Match ${i+1}</span>
        <span class="match-name ${m.winner===m.a?'winner':''}">${participantLabel(activite, m.a)}</span>
        <span class="hint" style="margin:0 4px;">${scoreLabel}</span>
        <span class="match-name ${m.winner===m.b?'winner':''}">${participantLabel(activite, m.b)}</span>
        ${joue ? `<span class="hint">(${m.pointsA}/${m.pointsB} pts)</span>` : ''}
      </div>`;
    }).join('');
    return `
      <div class="poule-card">
        <h4>${act.terrainLabel.replace(/s$/,'')} ${t}</h4>
        ${playersSummary ? `<div class="table-players-summary">${playersSummary}</div>` : ''}
        ${rows}
      </div>`;
  }).join('');

  const pdfBtn = act.type === 'individuel'
    ? `<button class="btn secondary small" id="btnExportFeuilles">🖨️ Feuilles de match (PDF)</button>`
    : '';

  return `
    <div class="card">
      <div class="toolbar">
        <h3>📅 Ordre des matchs</h3>
        <div style="display:flex;gap:6px;">
          ${pdfBtn}
          <button class="btn secondary small" id="btnExportMatchs">📊 Exporter Excel</button>
        </div>
      </div>
      <p class="hint">Cliquez sur un match pour saisir le score — les points marqués (selon l'écart) et le classement des poules (ci-dessus) se mettent à jour automatiquement.</p>
      <div class="poules-grid">${tableCards}</div>
    </div>`;
}

function renderClassementTable(students, wins){
  const sorted = students.slice().sort((a,b)=> (wins[b.id]||0) - (wins[a.id]||0));
  const rows = sorted.map((s,i)=>`
    <tr>
      <td><b>${i+1}</b></td>
      <td>${s.nomPrenom}</td>
      <td>${wins[s.id]||0}</td>
    </tr>`).join('');
  return `
    <div class="table-wrap">
      <table class="classement-table">
        <thead><tr>
          <th style="background:${PALETTE[0]}">Rang</th>
          <th style="background:${PALETTE[1]}">Nom Prénom</th>
          <th style="background:${PALETTE[2]}">Victoires</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

// Victoires marquées lors d'une séance donnée (défis hasard ou défis
// classement progressif) — utilisé pour reconstituer le détail séance par
// séance du classement total, qui cumule les victoires d'une séance à
// l'autre (voir cd.wins).
function computeSeanceDefisWins(seance){
  if(seance.tournamentType === 'defisHasard') return seance.hasardWins || {};
  if(seance.tournamentType === 'defisClassement'){
    const tally = {};
    (seance.defisMatches||[]).forEach(m=>{ if(m.winner) tally[m.winner] = (tally[m.winner]||0) + 1; });
    return tally;
  }
  return {};
}
// Classement détaillé : une colonne par séance de défis (hasard ou
// classement progressif) jouée par cette classe, plus une colonne Total —
// pour comprendre pourquoi deux élèves n'ont pas le même nombre de
// victoires total (et donc pourquoi ils ne s'affrontent pas forcément) en
// voyant d'où viennent leurs victoires séance par séance.
function renderClassementParSeance(cd, students){
  const seancesDefis = cd.seances.filter(s=> s.tournamentType==='defisHasard' || s.tournamentType==='defisClassement');
  if(!seancesDefis.length) return '';
  const perSeance = seancesDefis.map(s=>computeSeanceDefisWins(s));
  const headerCols = seancesDefis.map(s=>`<th style="background:${PALETTE[3 + (s.numero % (PALETTE.length-3))]}">Séance ${s.numero}</th>`).join('');
  const sorted = students.slice().sort((a,b)=> (cd.wins[b.id]||0) - (cd.wins[a.id]||0));
  const rows = sorted.map((s,i)=>{
    const cells = perSeance.map(map=>`<td>${map[s.id]||0}</td>`).join('');
    return `
      <tr>
        <td><b>${i+1}</b></td>
        <td>${s.nomPrenom}</td>
        ${cells}
        <td><b>${cd.wins[s.id]||0}</b></td>
      </tr>`;
  }).join('');
  return `
    <div class="table-wrap">
      <table class="classement-table">
        <thead><tr>
          <th style="background:${PALETTE[0]}">Rang</th>
          <th style="background:${PALETTE[1]}">Nom Prénom</th>
          ${headerCols}
          <th style="background:${PALETTE[2]}">Total</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function renderDefisHasardSection(activite){
  const cd = currentClasseData(activite);
  const seance = currentSeance(activite);
  const act = ACTIVITIES[activite];
  const students = STATE.allStudents.filter(s=>s.classe===cd.classe && !seance.absents.includes(s.id));
  const wins = cd.wins || {};
  const maxWins = Math.max(20, ...students.map(s=>wins[s.id]||0));
  const cols = Array.from({length:maxWins}, (_,i)=>i+1);

  const rows = students.map(s=>{
    const w = wins[s.id]||0;
    const cells = cols.map(c=>`<td class="defis-cell">${c<=w?'✕':''}</td>`).join('');
    return `
      <tr class="defis-row" data-defis-student="${s.id}">
        <td class="defis-name">${s.nomPrenom}
          <button class="btn small ghost defis-undo" data-defis-undo="${s.id}" title="Annuler la dernière victoire">↩</button>
        </td>
        ${cells}
      </tr>`;
  }).join('');

  return `
    <div class="card">
      <h3>🎲 Défis hasard — Nombre de victoires</h3>
      ${checkboxRangeHtml('defisTerrainCbGroup', act.terrainLabel+' disponibles', act.defisTerrainMin, act.defisTerrainMax, seance.defisTerrains || act.defisTerrainMin)}
      <p class="hint">Cliquez sur la ligne d'un élève pour lui ajouter une victoire.</p>
      <div class="table-wrap">
        <table class="defis-table">
          <thead><tr>
            <th style="background:${PALETTE[0]}">Élève</th>
            ${cols.map(c=>`<th style="background:${PALETTE[c % PALETTE.length]}">${c}</th>`).join('')}
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
}

function renderDefisClassementSection(activite){
  const cd = currentClasseData(activite);
  const seance = currentSeance(activite);
  const act = ACTIVITIES[activite];
  if(!seance.defisMatches) seance.defisMatches = [];
  const isBadminton = activite === 'Badminton';
  const capacite = defisCapacite(seance);
  const started = seance.defisMatches.length > 0;

  // dernier match connu de chaque table = le match actuellement affiché
  const parTable = {};
  seance.defisMatches.forEach((m,i)=>{ parTable[m.table] = i; });
  const tableCards = [];
  for(let t=1; t<=capacite; t++){
    const i = parTable[t];
    if(i === undefined){
      tableCards.push(`
        <div class="poule-card">
          <h4>${act.terrainLabel.replace(/s$/,'')} ${t}</h4>
          <p class="hint">En attente d'élèves disponibles…</p>
        </div>`);
      continue;
    }
    const m = seance.defisMatches[i];
    const nomA = participantLabel(activite, m.a);
    const nomB = participantLabel(activite, m.b);
    const refereeLabel = m.referee ? participantLabel(activite, m.referee) : 'Auto-arbitrage';
    tableCards.push(`
      <div class="poule-card">
        <h4>${act.terrainLabel.replace(/s$/,'')} ${t}</h4>
        <div class="hint" style="text-align:center;">${ordinalMatch(m.numA)}</div>
        <button class="btn ${m.winner===m.a?'':'ghost'}" data-set-winner="${i}::${m.a}">${nomA}</button>
        <div class="hint" style="text-align:center;margin:4px 0;">contre</div>
        <div class="hint" style="text-align:center;">${ordinalMatch(m.numB)}</div>
        <button class="btn ${m.winner===m.b?'':'ghost'}" data-set-winner="${i}::${m.b}">${nomB}</button>
        <div class="arbitre-label">🧑‍⚖️ Arbitre : <b>${refereeLabel}</b></div>
      </div>`);
  }

  const byeList = Array.isArray(seance.defisBye) ? seance.defisBye : (seance.defisBye ? [seance.defisBye] : []);
  const byeHtml = byeList.length
    ? `<p class="hint">Exempté(e)(s) pour l'instant, en attente d'un adversaire au même nombre de victoires : ${byeList.map(id=>participantLabel(activite, id)).join(', ')}</p>`
    : '';

  const demiTerrainToggle = isBadminton ? `
    <label class="demi-terrain-toggle">
      <input type="checkbox" id="chkDemiTerrain" ${seance.demiTerrain?'checked':''}>
      Jouer sur demi-terrain (double le nombre de matchs simultanés)
    </label>` : '';

  const students = STATE.allStudents.filter(s=>s.classe===cd.classe);
  const seanceWins = {};
  seance.defisMatches.forEach(m=>{ if(m.winner) seanceWins[m.winner] = (seanceWins[m.winner]||0) + 1; });

  // Progression de la rotation en cours (le dernier match connu de chaque
  // table) : la rotation suivante n'est générée que lorsque tout est à 100%.
  const rotationMatches = Object.values(parTable).map(i=>seance.defisMatches[i]);
  const rotationTerminees = rotationMatches.filter(m=>m.winner!==null).length;
  const rotationHtml = rotationMatches.length
    ? `<p class="hint">Rotation en cours : <b>${rotationTerminees}/${rotationMatches.length}</b> matchs terminés.</p>`
    : '';

  return `
    <div class="card">
      <div class="toolbar">
        <h3>📈 Défis classement progressif</h3>
        <div style="display:flex;gap:6px;">
          ${!started ? `<button class="btn" id="btnDemarrerDefis">▶️ Démarrer les matchs</button>` : ''}
          ${seance.lastAction ? `<button class="btn danger small" id="btnAnnulerDernierResultat">↩️ Annuler le dernier résultat</button>` : ''}
          ${started ? `<button class="btn secondary small" id="btnExportDefisMatchs">📊 Exporter Excel</button>` : ''}
        </div>
      </div>
      ${checkboxRangeHtml('defisTerrainCbGroup', act.terrainLabel+' disponibles', act.defisTerrainMin, act.defisTerrainMax, seance.defisTerrains || act.defisTerrainMin)}
      ${demiTerrainToggle}
      <p class="hint">Les élèves ayant le même nombre de victoires s'affrontent. Cliquez sur le nom du vainqueur de chaque match. La rotation suivante s'organise automatiquement pour tout le monde une fois que <b>tous</b> les matchs de la rotation en cours sont terminés (pas de table qui avance plus vite qu'une autre). S'il y a plus d'élèves que de tables, les non-joueurs officient comme arbitres.</p>
      ${rotationHtml}
      ${byeHtml}
      ${started ? `
      <div class="defis-layout">
        <div class="defis-tables-grid">${tableCards.join('')}</div>
        <div class="defis-classement-live">
          <h4>🏅 Classement de cette séance</h4>
          <p class="hint">Se met à jour à chaque résultat enregistré.</p>
          ${renderClassementTable(students, seanceWins)}
        </div>
      </div>` : `<div class="empty-state">Choisissez le nombre de ${act.terrainLabel.toLowerCase()} puis cliquez sur « Démarrer les matchs ».</div>`}
    </div>`;
}

  await loadState();
  renderTabs();
  renderAll();
  document.getElementById('btnValiderScore').addEventListener('click', validerScoreModal);
  document.getElementById('btnAnnulerScore').addEventListener('click', closeScoreModal);
  document.getElementById('btnAbandonA').addEventListener('click', ()=>abandonScoreModal('a'));
  document.getElementById('btnAbandonB').addEventListener('click', ()=>abandonScoreModal('b'));
  document.getElementById('scoreModal').addEventListener('click', (e)=>{
    if(e.target.id === 'scoreModal') closeScoreModal();
  });
  document.getElementById('btnStatutPresent').addEventListener('click', ()=>choisirStatutPresence(null));
  document.getElementById('btnStatutAbsent').addEventListener('click', ()=>choisirStatutPresence('absent'));
  document.getElementById('btnStatutMateriel').addEventListener('click', ()=>choisirStatutPresence('materiel'));
  document.getElementById('btnStatutDispense').addEventListener('click', ()=>choisirStatutPresence('dispense'));
  document.getElementById('presenceModal').addEventListener('click', (e)=>{
    if(e.target.id === 'presenceModal') closePresenceModal();
  });
});
</script>
